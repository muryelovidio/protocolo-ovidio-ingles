<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Praticar fala — Protocolo Ovídio</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --dark:#232323;--red:#E11B22;--red-dark:#B5151B;
  --bg:#F5F5F2;--card:#fff;
  --border:#E2E0D8;--border-strong:#CFCCC0;
  --text:#232323;--soft:#6B6A63;--faint:#99978C;
  --gold:#FFFBEA;--s1:#2C6FD1;
  --green:#22C55E;--amber:#F59E0B;--rose:#EF4444;
  --font-d:'Space Grotesk',sans-serif;
  --font-b:'Inter',sans-serif;
  --font-m:'JetBrains Mono',monospace;
}
body{font-family:var(--font-b);background:var(--bg);color:var(--text);min-height:100vh;padding:20px 16px 60px;font-size:15px}
h1{font-family:var(--font-d);font-size:24px;font-weight:700;margin-bottom:4px}
.kicker{font-family:var(--font-m);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:6px}
.lead{font-size:14px;color:var(--soft);line-height:1.55;margin-bottom:20px}


/* tabs de seção (LEGO / Boosts / Fluency) */
.section-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.section-tab{
  flex:1;min-width:calc(33% - 6px);
  padding:12px 14px;border:1.5px solid var(--border-strong);border-radius:10px;
  background:var(--card);cursor:pointer;transition:all .15s;
  font-family:var(--font-d);font-size:13px;font-weight:600;text-align:left;
  color:var(--text);line-height:1.3;
}
.section-tab:hover{transform:translateY(-1px)}
.section-tab .tab-emoji{font-size:16px;display:block;margin-bottom:3px}
.section-tab .tab-sub{display:block;font-family:var(--font-b);font-weight:400;font-size:11px;color:var(--soft);margin-top:2px}
/* estados ativos por seção — cor de fundo indica tipo */
.section-tab.tab-lego.active{background:var(--red);color:#fff;border-color:var(--red)}
.section-tab.tab-lego.active .tab-sub{color:rgba(255,255,255,.8)}
.section-tab.tab-boosts{background:#EBF3FC;border-color:#B8D4F0}
.section-tab.tab-boosts.active{background:#2C6FD1;color:#fff;border-color:#2C6FD1}
.section-tab.tab-boosts.active .tab-sub{color:rgba(255,255,255,.8)}
.section-tab.tab-fluency{background:#FFF8E0;border-color:#F0E4B0}
.section-tab.tab-fluency.active{background:#C98A00;color:#fff;border-color:#C98A00}
.section-tab.tab-fluency.active .tab-sub{color:rgba(255,255,255,.8)}

/* section container */
.section-body{display:none}
.section-body.active{display:block}

/* selector */
.selector{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}
.sel-btn{padding:9px 16px;border:1.5px solid var(--border-strong);border-radius:8px;background:var(--card);font-family:var(--font-d);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;text-align:left}
.sel-btn:hover{border-color:var(--dark)}
.sel-btn.active{border-color:var(--red);background:var(--red);color:#fff}
.sel-btn .sub{display:block;font-family:var(--font-m);font-size:10px;font-weight:400;opacity:.8;margin-top:2px}

/* lego card */
.lego-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.lego-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.lego-num{font-family:var(--font-m);font-size:11px;color:var(--faint)}
.lego-stem{font-family:var(--font-m);font-size:16px;font-weight:600;color:var(--dark)}
.lego-pt{font-size:13px;color:var(--soft)}
.lego-note{font-size:12px;color:var(--soft);font-style:italic;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--dark);color:#fff;padding:7px 10px;text-align:left;font-family:var(--font-m);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}
th:first-child{border-radius:5px 0 0 0}th:last-child{border-radius:0 5px 0 0}
td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.45}
tr:nth-child(even) td{background:rgba(0,0,0,.018)}
tr:last-child td{border:none}
td strong{font-family:var(--font-m)}
.mono{font-family:var(--font-m);font-size:12px;color:var(--soft)}

/* botão de play — linha LEGO (ouvir frase em inglês) */
.lego-en-cell{display:flex;align-items:center;gap:8px}
.row-play-btn{
  flex-shrink:0;
  display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;min-width:26px;
  padding:0;margin:0;
  border:1.5px solid var(--border-strong);border-radius:50%;
  background:var(--card);color:var(--dark);
  cursor:pointer;transition:background .15s,border-color .15s,transform .1s;
  position:relative;
}
/* área de toque confortável mesmo com botão visualmente pequeno (mobile) */
.row-play-btn::after{content:'';position:absolute;inset:-8px}
.row-play-btn:hover{border-color:var(--red);color:var(--red)}
.row-play-btn:active{transform:scale(0.92)}
.row-play-btn:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.row-play-icon{font-size:10px;line-height:1;margin-left:1px}
/* estado "tocando": ícone muda para pausa + anel pulsante — não depende só de cor */
.row-play-btn.playing{border-color:var(--red);background:var(--red);color:#fff}
.row-play-btn.playing .row-play-icon::before{content:'⏸';font-size:10px;margin:0}
.row-play-btn.playing .row-play-icon{visibility:hidden;position:relative}
.row-play-btn.playing .row-play-icon::before{visibility:visible;position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.row-play-btn.playing{animation:row-play-pulse 1.2s ease-in-out infinite}
@keyframes row-play-pulse{0%,100%{box-shadow:0 0 0 0 rgba(225,27,34,.35)}50%{box-shadow:0 0 0 5px rgba(225,27,34,0)}}
.lego-en-text{flex:1}

/* notes card */
.notes-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.notes-label{display:block;font-family:var(--font-d);font-size:13.5px;font-weight:600;margin-bottom:8px;color:var(--text)}
.notes-area{width:100%;min-height:70px;max-height:220px;resize:vertical;font-family:var(--font-b);font-size:14px;line-height:1.5;padding:10px 12px;border:1px solid var(--border-strong);border-radius:8px;background:#FFFEF9;color:var(--text);transition:border-color .15s}
.notes-area:focus{outline:none;border-color:var(--red)}
.notes-area::placeholder{color:var(--faint);font-style:italic}

/* ai-practice */
.ai-practice{border:1.5px solid var(--border);border-radius:12px;overflow:hidden;margin-top:12px}
.ap-trigger{width:100%;display:flex;align-items:center;gap:10px;background:var(--card);border:none;padding:14px 18px;cursor:pointer;font-size:14px;font-weight:600;font-family:var(--font-d);color:var(--text);text-align:left;transition:background .15s}
.ap-trigger:hover{background:var(--bg)}
.ap-icon{font-size:18px}
.ap-trigger span:nth-child(2){flex:1}
.ap-chev{font-size:14px;color:var(--faint);transition:transform .2s}
.ap-body{border-top:1px solid var(--border);background:#FAFAF7;padding:20px}

/* start card */
.ap-start{text-align:center;padding:12px 0}
.ap-start-title{font-family:var(--font-d);font-size:17px;font-weight:600;margin-bottom:6px}
.ap-start-sub{font-size:13.5px;color:var(--soft);margin-bottom:16px;line-height:1.55}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--red);color:#fff;border:none;border-radius:8px;padding:11px 22px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;font-family:var(--font-b)}
.btn:hover{background:var(--red-dark)}
.btn-dark{background:var(--dark)}.btn-dark:hover{background:#3a3a3a}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border-strong)}
.btn-outline:hover{background:var(--bg)}
.ap-warn{padding:12px 14px;background:#FEF3C7;border-left:3px solid var(--amber);border-radius:0 6px 6px 0;font-size:13px;color:#78350F;margin-top:12px;text-align:left}

/* loading */
.ap-loading{display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 0;color:var(--soft);font-size:14px}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* question */
.ap-qhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.ap-counter{font-family:var(--font-m);font-size:12px;color:var(--faint);white-space:nowrap;font-weight:600}
.ap-pbar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.ap-pfill{height:100%;background:var(--red);border-radius:3px;transition:width .4s}

.ap-qcard{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin-bottom:14px}
.ap-qtxt{font-size:17px;font-weight:600;font-family:var(--font-d);line-height:1.4;margin-bottom:12px;color:var(--text)}
.ap-hint-btn{background:transparent;border:1px dashed var(--border-strong);color:var(--soft);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.ap-hint-btn:hover{border-color:var(--red);color:var(--red)}
.ap-hint-panel{display:none;margin-top:12px;padding:12px 14px;background:var(--gold);border:1px solid #F0E4B0;border-radius:8px;font-size:13.5px;line-height:1.55}
.ap-hint-panel.show{display:block}
.ap-hint-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.ap-hint-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:7px 10px;background:#fff;border:1px solid #E8E0B4;border-radius:7px}
.ap-hint-en{font-family:var(--font-m);font-weight:700;font-size:15px;color:var(--dark)}
.ap-hint-pr{font-family:var(--font-m);font-size:12.5px;color:var(--soft);font-style:italic}
.ap-hint-eq{color:var(--faint);font-size:13px;margin:0 2px}
.ap-hint-pt{font-size:13.5px;color:var(--text-soft, #6B6A63)}
.ap-hint-panel .play-btn{background:var(--dark);color:#fff;border:none;border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:5px}
.ap-hint-panel .play-btn:hover{background:#3a3a3a}

/* record */
.ap-rec-area{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.ap-mic{display:flex;align-items:center;gap:10px;background:var(--dark);color:#fff;border:none;border-radius:50px;padding:14px 28px;font-size:15px;font-weight:700;cursor:pointer;transition:background .15s,transform .1s;font-family:var(--font-b)}
.ap-mic:hover{background:#3a3a3a;transform:scale(1.02)}
.ap-mic.rec{background:var(--red);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(225,27,34,.4)}50%{box-shadow:0 0 0 8px rgba(225,27,34,0)}}
.ap-mic-icon{font-size:20px}
.ap-rec-ind{display:none;align-items:center;gap:8px;font-size:13px;color:var(--red);font-weight:600}
.ap-recdot{width:10px;height:10px;border-radius:50%;background:var(--red);animation:blink 1s step-start infinite}
@keyframes blink{50%{opacity:0}}


/* sentence pronunciation — item 11 (SEMPRE aparece) */
.ap-sentence-pr{font-family:var(--font-m);font-size:18px;font-weight:600;color:var(--dark);background:var(--gold);border:1px solid #F0E4B0;border-radius:10px;padding:14px 16px;margin:12px 0;text-align:center;letter-spacing:.01em;line-height:1.4}

/* error box — item 12 (só aparece se houve erro) */
.ap-err-box{background:#FFF8F8;border:1px solid #F5D0D0;border-radius:10px;padding:12px 14px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.ap-err-line{padding:8px 10px;background:#fff;border-radius:6px;border:1px solid #F0DADA}
.ap-err-word-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14.5px;margin-bottom:4px}
.ap-err-x{font-size:14px}
.ap-err-word-row strong{font-family:var(--font-m);color:var(--dark);font-size:15px}
.ap-err-arrow{color:var(--faint);margin:0 2px}
.ap-word-pr{font-family:var(--font-m);color:var(--rose);font-weight:600}
.ap-err-heard{font-size:12.5px;color:var(--soft);padding-left:22px}
.ap-heard-txt{font-family:var(--font-m);color:var(--dark);font-style:italic}
.ap-heard-none{font-style:italic;color:var(--faint)}

/* success card variant */
.ap-fb-card.success{border-color:#BFE6C9;background:#F6FBF7}
.ap-fb-card.warn{border-color:#F0DADA;background:#FEFBFB}


/* Boosts de Vocabulário */
.boost-card{background:#EBF3FC;border:1px solid #B8D4F0;border-radius:14px;padding:18px 20px;margin-bottom:16px}
.boost-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.boost-num{font-family:var(--font-m);font-size:11px;color:#2C6FD1;font-weight:600}
.boost-pattern{font-family:var(--font-m);font-size:16px;font-weight:700;color:#1A4A94}
.boost-rule{font-size:13px;color:var(--soft);font-style:italic}
.boost-model{font-size:13.5px;color:var(--text);margin-bottom:12px;padding:8px 12px;background:#fff;border-radius:8px;border-left:3px solid #2C6FD1}
.boost-example{background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:14px;border:1px solid #B8D4F0}
.boost-example-en{font-family:var(--font-m);font-size:13px;line-height:1.45;color:var(--text);margin-bottom:5px;word-break:break-word}
.boost-example-pr{font-family:var(--font-m);font-size:12px;color:var(--soft);font-style:italic;margin-bottom:5px;word-break:break-word;line-height:1.45}
.boost-example-pt{font-size:13px;line-height:1.45;color:var(--text);word-break:break-word}
.boost-highlight{color:var(--red);font-weight:700}
.boost-model .lbl{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:3px}
.boost-model .txt{font-family:var(--font-m);font-weight:600}

/* Exercício de tradução escrita */
.exercise-card{background:#fff;border:2px solid #B8D4F0;border-radius:12px;padding:16px 18px;margin-top:14px}
.exercise-title{font-family:var(--font-d);font-size:15px;font-weight:600;margin-bottom:6px;color:var(--dark);display:flex;align-items:center;gap:8px}
.exercise-desc{font-size:13px;color:var(--soft);margin-bottom:14px;line-height:1.5}
.exercise-example{background:#FFF8E0;border:1px solid #F0E4B0;border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:13.5px}
.exercise-example .ex-lbl{display:block;font-size:11px;color:#8F6300;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.exercise-example .ex-en{font-family:var(--font-m);font-weight:600;font-size:15px}
.exercise-example .ex-pr{font-family:var(--font-m);font-size:12.5px;color:var(--soft);margin:0 6px}
.exercise-example .ex-pt{color:var(--text)}

.exq-item{margin-bottom:18px;padding-top:14px;border-top:1px dashed var(--border)}
.exq-item:first-of-type{border-top:none;padding-top:0}
.exq-counter{font-family:var(--font-m);font-size:11px;color:var(--faint);margin-bottom:6px;display:block}
.exq-prompt{font-family:var(--font-d);font-size:15px;font-weight:600;margin-bottom:10px;line-height:1.4}
.exq-hint{display:none;background:#F5F5F2;border-radius:7px;padding:9px 12px;margin-bottom:10px;font-size:13px}
.exq-hint.show{display:flex;flex-direction:column;gap:6px}
.hint-line{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
.hint-pt{color:var(--soft)}
.hint-ctx{color:var(--soft);font-style:italic}
.hint-arr{color:var(--faint);flex-shrink:0}
.hint-w{font-family:var(--font-m);font-weight:700;color:var(--dark)}
.hint-ctx-en{font-family:var(--font-m);font-weight:600;color:var(--dark);font-style:italic}
.exq-hint-btn{background:transparent;border:1px dashed var(--border-strong);color:var(--soft);border-radius:14px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;margin-bottom:8px;font-family:var(--font-b)}
.exq-hint-btn:hover{border-color:var(--dark);color:var(--text);background:var(--bg)}
.exq-input{width:100%;font-family:var(--font-b);font-size:14px;padding:9px 12px;border:1px solid var(--border-strong);border-radius:7px;background:#FFFEF9}
.exq-input:focus{outline:none;border-color:#2C6FD1}
.exq-check-btn{background:#2C6FD1;color:#fff;border:none;border-radius:7px;padding:8px 18px;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px}
.exq-check-btn:hover{background:#1A4A94}
.exq-check-btn:disabled{opacity:.4;cursor:not-allowed}

.exq-reveal{display:none;margin-top:12px;padding:12px;background:#F5F5F2;border-radius:8px}
.exq-reveal.show{display:block}
.exq-reveal .rev-lbl{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:4px}
.exq-reveal .rev-en{font-family:var(--font-m);font-weight:600;font-size:15px;color:var(--dark)}
.exq-reveal .rev-pr{font-family:var(--font-m);font-size:13px;color:var(--soft);margin-top:3px;display:block}
.exq-reveal .rev-user{font-size:12.5px;color:var(--soft);margin-top:8px;font-style:italic}
.exq-reveal .rev-user b{font-family:var(--font-m);font-style:normal;color:var(--text)}

.self-eval{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.self-eval-btn{flex:1;min-width:80px;padding:9px 12px;border:1.5px solid var(--border-strong);border-radius:8px;background:#fff;cursor:pointer;font-family:var(--font-b);font-size:13px;font-weight:600;transition:all .15s}
.self-eval-btn:hover{transform:translateY(-1px)}
.self-eval-btn.acertei{color:#166534}
.self-eval-btn.quase{color:#8F6300}
.self-eval-btn.errei{color:#991B1B}
.self-eval-btn.acertei.selected{background:#DCFCE7;border-color:#22C55E;color:#166534}
.self-eval-btn.quase.selected{background:#FEF3C7;border-color:#F59E0B;color:#8F6300}
.self-eval-btn.errei.selected{background:#FEE2E2;border-color:#EF4444;color:#991B1B}

.boost-gen-loading{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 0;color:var(--soft);font-size:13.5px}

/* Fluency Training — quiz estruturado */
.fluency-card{background:#FFF8E0;border:1px solid #F0E4B0;border-radius:14px;padding:18px 20px;margin-bottom:16px}

/* Fase 1: intro */
.ft-intro-title{font-family:var(--font-d);font-size:18px;font-weight:700;color:#8F6300;margin-bottom:16px}
.ft-lbl{display:block;font-family:var(--font-m);font-size:11px;color:#8F6300;text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:8px}
.ft-intro-objective,.ft-intro-legos,.ft-intro-vocab,.ft-intro-scenario{background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:12px;border:1px solid #F0E4B0}
.ft-intro-objective p,.ft-intro-scenario p{font-size:13.5px;line-height:1.5;color:var(--text);margin:0}
.ft-lego-item{padding:6px 0;border-bottom:1px dashed #F0E4B0;font-size:13px;line-height:1.4}
.ft-lego-item:last-child{border-bottom:none}
.ft-lego-name{font-family:var(--font-m);color:var(--dark);margin-right:6px}
.ft-lego-desc{color:var(--soft);font-size:12.5px}
.ft-lego-ex{display:block;font-family:var(--font-m);font-size:12px;color:var(--faint);font-style:italic;margin-top:2px;margin-left:12px}
.ft-vocab-item{padding:5px 0;font-size:13px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.ft-vocab-en{font-family:var(--font-m);color:var(--dark)}
.ft-vocab-pr{font-family:var(--font-m);font-size:11.5px;color:var(--soft);font-style:italic}
.ft-vocab-pt{font-size:12.5px;color:var(--text-soft, #6B6A63)}
.ft-intro-actions{margin-top:16px;text-align:center}
.ft-start-btn{background:#C98A00}
.ft-start-btn:hover{background:#8F6300}

/* Fase 2: pergunta */
.ft-qhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ft-counter{font-family:var(--font-m);font-size:11px;font-weight:600;color:var(--faint);white-space:nowrap}
.ft-pbar{flex:1;height:5px;background:#F0E4B0;border-radius:3px;overflow:hidden}
.ft-pfill{height:100%;background:#C98A00;transition:width .3s ease}
.ft-context{font-size:12.5px;color:var(--soft);font-style:italic;margin-bottom:10px;padding-left:8px;border-left:2px solid #C98A00}

.ft-ia-bubble{background:#fff;border:1px solid #F0E4B0;border-radius:14px;border-bottom-left-radius:4px;padding:12px 14px;margin-bottom:14px;max-width:88%}
.ft-ia-speaker{font-family:var(--font-m);font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.ft-ia-text{font-family:var(--font-m);font-size:15px;line-height:1.4;color:var(--dark);margin-bottom:8px}
.ft-ia-actions{display:flex;gap:6px;flex-wrap:wrap}
.ft-icon-btn{background:#fff;border:1px solid var(--border-strong);border-radius:16px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;padding:0;transition:all .15s}
.ft-icon-btn:hover{background:var(--bg);border-color:var(--dark)}
.ft-icon-btn.playing{background:var(--red);border-color:var(--red);color:#fff}
.ft-ia-transcription,.ft-ia-translation{display:none;margin-top:8px;padding:7px 10px;background:#F5F5F2;border-radius:6px;font-size:12.5px;line-height:1.4;color:var(--text)}
.ft-ia-transcription.show,.ft-ia-translation.show{display:block}
.ft-ia-transcription{font-family:var(--font-m);color:var(--soft);font-style:italic}

/* área de resposta */
.ft-answer-area{margin-bottom:12px}
.ft-mode-tabs{display:flex;gap:6px;margin-bottom:10px}
.ft-mode-btn{flex:1;background:#fff;border:1.5px solid var(--border-strong);border-radius:8px;padding:8px 12px;font-family:var(--font-d);font-size:12.5px;font-weight:600;cursor:pointer;transition:all .15s;color:var(--soft)}
.ft-mode-btn.active{background:#C98A00;color:#fff;border-color:#C98A00}
.ft-text-input{width:100%;min-height:70px;max-height:200px;resize:vertical;font-family:var(--font-b);font-size:14px;padding:10px 12px;border:1.5px solid var(--border-strong);border-radius:8px;background:#fff}
.ft-text-input:focus{outline:none;border-color:#C98A00}
.ft-input-actions{text-align:right;margin-top:8px}
.ft-send-btn{background:#C98A00}
.ft-send-btn:hover{background:#8F6300}

/* áudio */
.ft-audio-area{background:#fff;border:1.5px solid var(--border-strong);border-radius:10px;padding:16px;text-align:center}
.ft-mic-btn{display:inline-flex;align-items:center;gap:10px;background:var(--dark);color:#fff;border:none;border-radius:50px;padding:12px 24px;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s,transform .1s;font-family:var(--font-b)}
.ft-mic-btn:hover{background:#3a3a3a}
.ft-mic-btn:active{transform:scale(.96)}
.ft-mic-btn.rec{background:var(--red);animation:mic-pulse 1.4s ease-in-out infinite}

.ft-mic-icon{font-size:16px}
.ft-mic-status{display:none;align-items:center;justify-content:center;gap:10px;margin-top:10px;font-family:var(--font-m);font-size:12px;color:var(--red)}
.ft-mic-wave{display:inline-block;width:8px;height:8px;background:var(--red);border-radius:50%;animation:mic-pulse 1s ease-in-out infinite}
.ft-transcript-preview{margin-top:12px;padding:8px 10px;background:#F5F5F2;border-radius:6px;font-size:13px;color:var(--text);min-height:20px;text-align:left}
.ft-transcript-preview:empty{display:none}

/* linha auxiliar (sugestões) */
.ft-actions-row{display:flex;gap:8px;margin-top:10px}
.ft-link-btn{background:transparent;border:1px dashed #C98A00;color:#8F6300;border-radius:16px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer}
.ft-link-btn:hover{background:#FFF8E0}

/* bubble do aluno + feedback */
.ft-user-bubble{background:#2C6FD1;color:#fff;border-radius:14px;border-bottom-right-radius:4px;padding:10px 13px;margin:14px 0 10px auto;max-width:88%}
.ft-user-speaker{font-family:var(--font-m);font-size:10.5px;color:rgba(255,255,255,.75);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;text-align:right}
.ft-user-text{font-size:14px;line-height:1.4}
.ft-user-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.ft-user-actions .ft-icon-btn{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);color:#fff;width:28px;height:28px;font-size:12px}
.ft-user-actions .ft-icon-btn:hover{background:rgba(255,255,255,.28)}

.ft-evaluating{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 0;color:var(--soft);font-size:13px}
.ft-feedback{margin-top:10px;padding:12px 14px;border-radius:10px;border:1px solid}
.ft-feedback.ok{background:#F6FBF7;border-color:#BFE6C9}
.ft-feedback.err{background:#FFF8F8;border-color:#F5D0D0}
.ft-verdict{font-family:var(--font-d);font-size:15px;font-weight:700;margin-bottom:8px}
.ft-verdict.ok{color:#166534}
.ft-verdict.err{color:#991B1B}
.ft-feedback-explain{margin-top:8px;padding-top:10px;border-top:1px dashed #F5D0D0}
.ft-fb-lbl{font-family:var(--font-m);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);margin-bottom:5px;font-weight:600}
.ft-fb-model{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fff;border-radius:6px;font-family:var(--font-m);font-size:14px;font-weight:600;color:var(--dark);margin-bottom:8px}
.ft-fb-lego{font-size:12.5px;color:var(--text-soft);margin-bottom:6px}
.ft-fb-lego strong{font-family:var(--font-m);color:var(--red)}
.ft-fb-tip{font-size:12.5px;color:var(--soft);line-height:1.45;font-style:italic}
.ft-fb-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ft-next-btn{background:#C98A00}
.ft-next-btn:hover{background:#8F6300}
.btn-outline{display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--soft);border:1.5px solid var(--border-strong);border-radius:8px;padding:10px 20px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:var(--font-b)}
.btn-outline:hover{border-color:var(--dark);color:var(--text)}

.ft-suggestions-box{background:#FFF8E0;border:1px dashed #C98A00;border-radius:8px;padding:10px 12px;margin-top:10px}
.ft-sugg-line{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;font-family:var(--font-m);font-size:13px;border-bottom:1px dashed #F0E4B0}

.ft-chip.miss{background:#F5F5F2;color:var(--soft);border:1px solid var(--border)}

.ap-analyzing p{font-size:13.5px;color:var(--soft)}
.ap-transcript{font-family:var(--font-m);font-size:12.5px;color:var(--faint);font-style:italic}

.ap-fb-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 20px}
.ap-fb-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ap-verdict{font-family:var(--font-d);font-size:17px;font-weight:700}
.ap-verdict.ok{color:var(--green)}
.ap-verdict.err{color:var(--rose)}
.ap-word-line{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;font-size:15px;font-family:var(--font-m)}
.ap-word{padding:4px 10px;border-radius:6px;font-weight:600;transition:all .15s}
.ap-word.ok{background:#DCFCE7;color:#166534}
.ap-word.err{background:#FEE2E2;color:#991B1B;text-decoration:line-through;text-decoration-thickness:2px}
.ap-word.missing{background:#FEF3C7;color:#92400E;font-style:italic}
.ap-heard{font-size:12.5px;color:var(--soft);margin-bottom:10px;font-family:var(--font-m)}
.ap-heard span{font-style:italic}

.ap-err-block{background:var(--gold);border:1px solid #F0E4B0;border-radius:8px;padding:12px 14px;margin-bottom:12px}
.ap-err-block .err-word{font-family:var(--font-m);font-weight:700;font-size:15px;color:var(--text);display:block;margin-bottom:4px}
.ap-err-block .err-pron{font-family:var(--font-m);font-size:14px;color:var(--soft);display:block;margin-bottom:8px}
.ap-err-block .play-word{background:var(--dark);color:#fff;border:none;border-radius:16px;padding:4px 10px;font-size:11.5px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.ap-err-block .play-word:hover{background:#3a3a3a}

.ap-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.ap-retry-btn{background:var(--dark);color:#fff;border:none;border-radius:8px;padding:11px 20px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font-b)}
.ap-retry-btn:hover{background:#3a3a3a}

/* result */
.ap-result{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px 22px;text-align:center}
.ap-rtitle{font-size:18px;font-weight:600;font-family:var(--font-d);margin-bottom:8px}
.ap-rmsg{font-size:14px;color:var(--soft);margin-bottom:20px}
.ap-r-stat{display:inline-block;font-family:var(--font-d);font-size:42px;font-weight:700;margin-bottom:4px;color:var(--red)}
.ap-r-sub{font-size:13px;color:var(--faint);margin-bottom:20px}

@media (max-width: 600px) {
  body{padding:14px 12px 40px}
  .ap-body{padding:16px}
  .ap-mic{width:100%;justify-content:center}
  .selector{gap:8px}
  .sel-btn{flex:1;min-width:calc(50% - 4px)}
}

// ── TTS via Google Translate (mesma voz do Google Tradutor) ──────────
// Usa a URL pública do Google TTS — natural, clara, sem chave de API.
// Cache em memória: cada texto só gera a URL uma vez por sessão.
// Fallback para Web Speech API caso o áudio falhe (ex: sem internet).
const HAS_TTS = true; // sempre ativado: Google TTS ou fallback Web Speech

let activeSpeakBtn = null;
let activeAudio = null; // instância Audio() em reprodução

function _gttsUrl(text) {
  return `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=en-US&client=tw-ob`;
}

// Toca via Google TTS. Sem estado visual de botão — usado nos hints da prática.
function speakEn(text) {
  _playGoogleTTS(text, null);
}

// Toca com estado visual de toggle — usado nos botões ▶ das linhas LEGO.
function speakEnToggle(text, btn) {
  const wasThisPlaying = activeSpeakBtn === btn;
  // parar o que estiver tocando
  if (activeAudio) { activeAudio.pause(); activeAudio = null; }
  if (activeSpeakBtn) {
    activeSpeakBtn.classList.remove('playing');
    activeSpeakBtn.setAttribute('aria-pressed', 'false');
    activeSpeakBtn = null;
  }
  if (wasThisPlaying) return; // toggle para PARAR
  _playGoogleTTS(text, btn);
}

function _playGoogleTTS(text, btn) {
  const audio = new Audio(_gttsUrl(text));
  audio.crossOrigin = 'anonymous';
  if (btn) {
    btn.classList.add('playing');
    btn.setAttribute('aria-pressed', 'true');
    activeSpeakBtn = btn;
    activeAudio = audio;
  }
  const done = () => {
    if (btn) {
      btn.classList.remove('playing');
      btn.setAttribute('aria-pressed', 'false');
    }
    if (activeSpeakBtn === btn) activeSpeakBtn = null;
    if (activeAudio === audio) activeAudio = null;
  };
  audio.onended = done;
  audio.onerror = () => {
    done();
    // fallback: Web Speech API caso Google TTS falhe
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = 0.9;
      if (btn) {
        u.onend = () => {
          btn.classList.remove('playing');
          btn.setAttribute('aria-pressed', 'false');
        };
      }
      window.speechSynthesis.speak(u);
    }
  };
  audio.play().catch(() => audio.onerror());
}

// ── API ────────────────────────────────────────────────
async function callAPI(payload) {
  const r = await fetch('/api/claude', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  const json = await r.json();
  if (!r.ok) throw new Error(json.error || 'Erro ' + r.status);
  return json;
}

async function claudeText(system, user, vocabHint, maxTokens) {
  const json = await callAPI({
    system, vocabHint,
    max_tokens: maxTokens || 800,
    messages: [{ role: 'user', content: user }],
  });
  return json.content[0].text.trim();
}

// ── geração de perguntas: formato "Como dizer 'X' em inglês?" ──
// Geração determinística: sem IA, sem latência, sem alucinação.
// Seleciona 3 blocos distintos do LEGO e monta pergunta + resposta + dica.
function genQuestions(lego) {
  // pegar 3 blocos distribuídos (primeiro, do meio, último)
  const n = lego.blocks.length;
  const idxs = n <= 3
    ? lego.blocks.map((_, i) => i)
    : [0, Math.floor(n / 2), n - 1];

  return idxs.map((bi, i) => {
    const b = lego.blocks[bi];
    const prompt = `Como dizer "${b.pt_stem} ${b.pt_tail}"?`;
    const expected = `${lego.stem} ${b.en}`;
    // dica: dois blocos — o stem e a expressão complementar
    const hint = [
      { en: lego.stem,  pr: lego.stem_pr,  pt: `${b.pt_stem}` },
      { en: b.en,       pr: b.pr,           pt: b.pt_tail      }
    ];
    return { id: i + 1, prompt, expected, hint };
  });
}

// ── análise textual + pronúncia figurada da frase inteira ─────
// Nota: com Web Speech API só temos TEXTO, não áudio real. A análise é comparação textual.
// O sentence_pr é obtido pelo dicionário oficial Ovídio (backend faz lookup ou aplica padrões).
async function analyzeAnswer(lego, expected, transcript) {
  const expectedWords = expected.replace(/[.,?!;:]/g,'').split(/\s+/).filter(Boolean);
  const raw = await claudeText(
    'Você é avaliador de inglês para brasileiros. Compara a fala transcrita com a esperada e devolve JSON válido, sem markdown.',
    `Estrutura ensinada: "${lego.stem}" (${lego.stem_pt})
Frase esperada (o que o aluno DEVERIA ter dito): "${expected}"
Transcript do reconhecedor de voz (o que o sistema OUVIU): "${transcript}"

IMPORTANTE:
- O reconhecedor só devolve TEXTO — não avalia pronúncia foneticamente. Nunca invente análise de pronúncia.
- Se o transcript está vazio ou o sistema não capturou algo utilizável, marque as palavras como ok:false e heard:null.
- NUNCA invente uma transcrição diferente do que o reconhecedor entregou.
- Para "sentence_pr" (pronúncia da FRASE inteira), use EXATAMENTE a pronúncia figurada oficial do Protocolo Ovídio para "${expected}" que está no DICIONÁRIO OFICIAL do system prompt. Se a frase completa não estiver, use pronúncias das palavras individuais concatenadas com espaço. Nunca use IPA.
- Para "correct_pr" de cada palavra errada, use EXATAMENTE a pronúncia figurada oficial do dicionário Ovídio.

Retorne JSON:
{
  "words": [
    {"expected": "palavra1", "ok": true/false, "heard": "o que foi ouvido no lugar OU null se não deu para identificar", "correct_pr": "pronúncia figurada Ovídio se ok=false, senão null"},
    ...uma entrada por palavra da frase esperada, na mesma ordem
  ],
  "sentence_pr": "pronúncia figurada Ovídio da frase completa: ${expected}",
  "structure_ok": true/false,
  "all_ok": true/false,
  "no_capture": true/false
}

Regras:
- Considere pequenas diferenças de artigo/pontuação como aceitáveis (ex: "a friend" vs "friend").
- Se o transcript não representa fala reconhecível (vazio, ruído), retorne no_capture:true e todas as palavras com ok:false + heard:null.`,
    // vocabHint inclui a frase esperada completa E cada palavra, para o backend anexar
    // as pronúncias oficiais no system prompt (evita alucinação da IA).
    [expected, ...expectedWords],
    900
  );
  return JSON.parse(raw.replace(/```json|```/g,'').trim());
}

// ── record ─────────────────────────────────────────────
function toggleRecord() {
  if (!HAS_SPEECH) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = el('ap-mic'), lbl = el('ap-mic-lbl'), ind = el('ap-rec-ind');

  if (rec) {
    // parar manualmente: processar o que foi coletado até agora
    const toProcess = typeof collected !== 'undefined' && collected.trim() ? collected.trim() : null;
    try { rec.stop(); } catch(e) {}
    rec = null;
    if (typeof silenceTimer !== 'undefined') clearTimeout(silenceTimer);
    mic.classList.remove('rec');
    lbl.textContent = 'Falar';
    ind.style.display = 'none';
    if (toProcess) processTranscript(toProcess);
    return;
  }

  rec = new SR();
  rec.lang = 'en-US';
  // continuous=true + coleta manual + timeout de silêncio:
  // garante que o aluno tenha ~1.5s extras após parar de falar antes do encerramento.
  rec.continuous = true;
  rec.interimResults = false;
  mic.classList.add('rec');
  lbl.textContent = 'Parar';
  ind.style.display = 'flex';

  let collected = '';
  let silenceTimer = null;

  function stopAndProcess() {
    if (!rec) return;
    clearTimeout(silenceTimer);
    silenceTimer = null;
    try { rec.stop(); } catch(e) {}
    rec = null;
    mic.classList.remove('rec');
    lbl.textContent = 'Falar';
    ind.style.display = 'none';
    if (collected.trim()) processTranscript(collected.trim());
  }

  rec.onresult = (e) => {
    // acumula todos os resultados finais
    let partial = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) partial += e.results[i][0].transcript + ' ';
    }
    if (partial) {
      collected += partial;
      // reinicia o timer de silêncio a cada nova fala reconhecida
      clearTimeout(silenceTimer);
      silenceTimer = setTimeout(stopAndProcess, 1500);
    }
  };

  // onspeechend: fala parou — aguarda o timer antes de encerrar
  rec.onspeechend = () => {
    if (!silenceTimer) silenceTimer = setTimeout(stopAndProcess, 1500);
  };

  rec.onend = () => {
    // SR encerrou por conta própria (ex: timeout do browser)
    if (rec) {
      rec = null;
      mic.classList.remove('rec');
      lbl.textContent = 'Falar';
      ind.style.display = 'none';
      if (collected.trim()) processTranscript(collected.trim());
    }
  };

  rec.onerror = (e) => {
    clearTimeout(silenceTimer);
    rec = null;
    mic.classList.remove('rec');
    lbl.textContent = 'Falar';
    ind.style.display = 'none';
    const msg = e.error === 'not-allowed' ? 'Permita o microfone nas configurações do navegador.' : e.error;
    setInner(el('ap-inner').innerHTML +
      `<div class="ap-warn">⚠️ ${msg}</div>`);
  };

  rec.start();
  // timer de segurança: encerra gravação após 30s máximo
  setTimeout(() => { if (rec) stopAndProcess(); }, 30000);
}

// ── análise + feedback ─────────────────────────────────
async function processTranscript(transcript) {
  setInner(`
    <div class="ap-analyzing">
      <div class="spinner"></div>
      <p>Analisando…</p>
      <p class="ap-transcript">"${transcript}"</p>
    </div>`);
  try {
    const q = questions[currentQ];
    const analysis = await analyzeAnswer(currentLego, q.expected, transcript);
    attemptsMade++;
    renderFeedback(analysis, transcript, q);
  } catch(e) {
    setInner(`<div class="ap-warn">❌ ${e.message}<br><br><button class="btn btn-outline" onclick="renderQuestion()">Voltar</button></div>`);
  }
}


// ── SONS de acerto/erro (Web Audio API sintético — item 16) ──
let audioCtx = null;
let lastSoundKey = null;
function playSound(type) {
  // toca uma única vez por tentativa: guarda chave da questão+tentativa+tipo
  const key = `${currentQ}:${attemptsMade}:${type}`;
  if (lastSoundKey === key) return;
  lastSoundKey = key;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // navegador pode bloquear autoplay — resumir se necessário
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    if (type === 'success') {
      // dois beeps curtos ascendentes
      [[660, 0], [880, 0.09]].forEach(([f, t]) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0, now + t);
        g.gain.linearRampToValueAtTime(0.12, now + t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, now + t + 0.09);
        o.connect(g).connect(audioCtx.destination);
        o.start(now + t); o.stop(now + t + 0.1);
      });
    } else {
      // um beep grave curto
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = 220;
      g.gain.setValueAtTime(0, now);
      g.gain.linearRampToValueAtTime(0.11, now + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      o.connect(g).connect(audioCtx.destination);
      o.start(now); o.stop(now + 0.17);
    }
  } catch(e) { /* silencioso se não suportado */ }
}

function renderFeedback(analysis, transcript, q) {
  const allOk = !!analysis.all_ok;
  const noCapture = !!analysis.no_capture;
  const isLast = currentQ === questions.length - 1;
  const canRetry = !allOk && attemptsMade < MAX_ATTEMPTS_PER_QUESTION;

  // ── 1. CHIPS: uma marcação por palavra da frase esperada (item 10) ──
  const wordsHtml = (analysis.words || []).map(w =>
    w.ok
      ? `<span class="ap-word ok">✓ ${w.expected}</span>`
      : `<span class="ap-word err">✗ ${w.expected}</span>`
  ).join('');

  // ── 2. PRONÚNCIA FIGURADA DA FRASE — SEMPRE APARECE (item 11) ──
  // A frase inteira num único bloco. Nunca palavra-por-palavra aqui.
  const sentencePr = analysis.sentence_pr || '';
  const sentencePrBlock = sentencePr
    ? `<div class="ap-sentence-pr" title="Pronúncia figurada Ovídio da frase completa">${sentencePr}</div>`
    : '';

  // ── 3. CAIXA DE FEEDBACK: só se houve erro (item 12) ──
  //     Só lista as palavras erradas. Sem repetir a frase toda.
  let errorBox = '';
  if (!allOk) {
    const wrongWords = (analysis.words || []).filter(w => !w.ok);
    const errorLines = wrongWords.map(w => {
      const heardTxt = noCapture || !w.heard
        ? `<span class="ap-heard-none">não conseguimos identificar com clareza</span>`
        : `Você disse algo como: <span class="ap-heard-txt">"${w.heard}"</span>`;
      const pron = w.correct_pr
        ? `pronuncia-se <span class="ap-word-pr">"${w.correct_pr}"</span>`
        : '';
      return `
        <div class="ap-err-line">
          <div class="ap-err-word-row">
            <span class="ap-err-x">❌</span>
            <strong>${w.expected}</strong>
            ${pron ? `<span class="ap-err-arrow">→</span> ${pron}` : ''}
          </div>
          <div class="ap-err-heard">${heardTxt}</div>
        </div>`;
    }).join('');
    errorBox = `<div class="ap-err-box">${errorLines}</div>`;
  }

  // ── 4. AÇÃO: próxima ou repetir ──
  let action;
  if (allOk) {
    sessionResults.push({ passed: true, attempts: attemptsMade });
    playSound('success');
    action = isLast
      ? `<button class="btn" onclick="finishPractice()">Ver resultado →</button>`
      : `<button class="btn" onclick="nextQuestion()">Próxima →</button>`;
  } else if (canRetry) {
    playSound('error');
    action = `<button class="ap-retry-btn" onclick="retryQuestion()">🎤 Tentar de novo</button>`;
  } else {
    sessionResults.push({ passed: false, attempts: attemptsMade });
    playSound('error');
    action = isLast
      ? `<button class="btn" onclick="finishPractice()">Ver resultado →</button>`
      : `<button class="btn" onclick="nextQuestion()">Continuar →</button>`;
  }

  // ── 5. VERDICT (feedback visual — item 17) ──
  const verdict = allOk
    ? `<div class="ap-verdict ok">✅ Perfeito!</div>`
    : `<div class="ap-verdict err">Quase lá — revise as palavras marcadas</div>`;

  setInner(`
    <div class="ap-qhead">
      <span class="ap-counter">${currentQ+1} / ${questions.length}</span>
      <div class="ap-pbar"><div class="ap-pfill" style="width:${Math.round(((currentQ+1)/questions.length)*100)}%"></div></div>
    </div>
    <div class="ap-fb-card ${allOk ? 'success' : 'warn'}">
      <div class="ap-fb-header">${verdict}</div>
      ${wordsHtml ? `<div class="ap-word-line">${wordsHtml}</div>` : ''}
      ${sentencePrBlock}
      ${errorBox}
      <div class="ap-actions">${action}</div>
    </div>`);
}

function retryQuestion() {
  lastSoundKey = null;
  renderQuestion();
}
function nextQuestion() {
  currentQ++;
  attemptsMade = 0;
  lastSoundKey = null;
  renderQuestion();
}

// ── resultado final ────────────────────────────────────
function finishPractice() {
  const passed = sessionResults.filter(r => r.passed).length;
  const total = sessionResults.length;
  const firstTry = sessionResults.filter(r => r.passed && r.attempts === 1).length;

  let msg;
  if (passed === total && firstTry === total) msg = 'Perfeito de primeira em todas! 🎯';
  else if (passed === total) msg = 'Todas corretas — bom trabalho!';
  else if (passed >= 2) msg = 'Bom trabalho — continue praticando.';
  else msg = 'Vale revisar a estrutura e tentar novamente.';

  setInner(`
    <div class="ap-result">
      <div class="ap-rtitle">🎯 Prática concluída</div>
      <div class="ap-r-stat">${passed}/${total}</div>
      <div class="ap-r-sub">frases acertadas</div>
      <div class="ap-rmsg">${msg}</div>
      <div class="ap-actions" style="justify-content:center">
        <button class="btn" onclick="startPractice()">🔄 Praticar novamente</button>
      </div>
    </div>`);
}

// Gera 3 perguntas usando o LEGO base + palavras variadas do Boost.
// Persiste respostas e auto-avaliação em localStorage.

async function renderBoostExercise(boost, boostIdx) {
  const container = document.getElementById(`boost-exercise-${boostIdx}`);
  const cacheKey = `boostQuestions:day1:boost${boostIdx}`;
  let questions = null;
  try {
    const cached = localStorage.getItem(cacheKey);
    if (cached) questions = JSON.parse(cached);
  } catch(e) {}

  // se não estiver em cache, gerar via IA
  if (!questions) {
    container.innerHTML = `
      <div class="exercise-card">
        <div class="boost-gen-loading">
          <div class="spinner"></div>
          <p>Preparando exercício…</p>
        </div>
      </div>`;
    try {
      questions = await genBoostQuestions(boost);
      try { localStorage.setItem(cacheKey, JSON.stringify(questions)); } catch(e) {}
    } catch(e) {
      try { questions = fallbackBoostQuestions(boost); } catch(e2) {}
    }
    // se o usuário trocou de aba enquanto aguardava, ou fallback falhou — abortar
    if (!document.getElementById(`boost-exercise-${boostIdx}`)) return;
    if (!questions || !questions.length) return;
  }

  // renderizar (o exemplo já aparece no topo do boost-card, não repetir aqui)
  const questionsHtml = questions.map((q, i) => {
    const ansKey = `boostAns:day1:boost${boostIdx}:q${i}`;
    const evalKey = `boostEval:day1:boost${boostIdx}:q${i}`;
    return `
      <div class="exq-item" data-idx="${i}">
        <span class="exq-counter">Pergunta ${i+1} de ${questions.length}</span>
        <div class="exq-prompt">${q.prompt}</div>
        <button class="exq-hint-btn" onclick="toggleExqHint(${boostIdx},${i})">💡 Dica</button>
        <div class="exq-hint" id="exq-hint-${boostIdx}-${i}">
          <div class="hint-line">
            <span class="hint-pt">${q.hint_word.boost_pt}</span>
            <span class="hint-arr">→</span>
            <span class="hint-w">${q.hint_word.boost_en}</span>
          </div>
          <div class="hint-line">
            <span class="hint-ctx">${q.hint_word.complement_pt}</span>
            <span class="hint-arr">→</span>
            <span class="hint-ctx-en">${q.hint_word.complement_en}</span>
          </div>
        </div>
        <input type="text" class="exq-input" id="exq-input-${boostIdx}-${i}"
               placeholder="Escreva sua resposta em inglês…"
               data-anskey="${ansKey}">
        <button class="exq-check-btn" id="exq-check-${boostIdx}-${i}"
                onclick="revealAnswer(${boostIdx}, ${i})">Ver resposta</button>
        <div class="exq-reveal" id="exq-reveal-${boostIdx}-${i}">
          <span class="rev-lbl">Resposta correta</span>
          <span class="rev-en">${q.expected}</span>
          <span class="rev-pr">${q.expected_pr}</span>
          <div class="rev-user" id="exq-user-${boostIdx}-${i}"></div>
          <div class="self-eval">
            <button class="self-eval-btn acertei" data-eval="acertei" data-key="${evalKey}">✅ Acertei</button>
            <button class="self-eval-btn quase" data-eval="quase" data-key="${evalKey}">🟡 Quase</button>
            <button class="self-eval-btn errei" data-eval="errei" data-key="${evalKey}">❌ Errei</button>
          </div>
        </div>
      </div>`;
  }).join('');

  // exemplo com destaque (agora dentro da caixa do exercício)
  const ex = boost.words[0];
  const exampleEnHtml = `<strong>${boost.lego_stem}</strong> <span class="boost-highlight">${ex.en}</span> ${ex.complement_en}`;
  const examplePrText = `${boost.lego_pr} ${ex.pr} ${ex.complement_pr}`;
  const examplePtHtml = `<strong>${boost.lego_pt}</strong> <span class="boost-highlight">${ex.pt_clean}</span> ${ex.complement_pt}`;

  container.innerHTML = `
    <div class="exercise-card">
      <div class="exercise-title">✍️ Exercício: tradução por escrito</div>
      <div class="exercise-desc">Traduza cada frase usando a estrutura vista e uma palavra do Boost.</div>
      <div class="boost-example">
        <div class="boost-example-en">${exampleEnHtml}</div>
        <div class="boost-example-pr">${examplePrText}</div>
        <div class="boost-example-pt">${examplePtHtml}</div>
      </div>
      ${questionsHtml}
    </div>`;

  // restaurar estado salvo
  questions.forEach((q, i) => {
    const input = document.getElementById(`exq-input-${boostIdx}-${i}`);
    const ansKey = input.dataset.anskey;
    try {
      const saved = localStorage.getItem(ansKey);
      if (saved) input.value = saved;
    } catch(e) {}
    input.addEventListener('input', () => {
      try { localStorage.setItem(ansKey, input.value); } catch(e) {}
    });

    // botões de auto-avaliação
    const btns = document.querySelectorAll(`#exq-reveal-${boostIdx}-${i} .self-eval-btn`);
    btns.forEach(b => {
      const key = b.dataset.key;
      try {
        const savedEval = localStorage.getItem(key);
        if (savedEval === b.dataset.eval) b.classList.add('selected');
      } catch(e) {}
      b.addEventListener('click', () => {
        btns.forEach(x => x.classList.remove('selected'));
        b.classList.add('selected');
        try { localStorage.setItem(key, b.dataset.eval); } catch(e) {}
      });
    });
  });
}

  if (!hint) return;
  const showing = hint.classList.toggle('show');

function revealAnswer(boostIdx, qIdx) {
  const input = document.getElementById(`exq-input-${boostIdx}-${qIdx}`);
  const reveal = document.getElementById(`exq-reveal-${boostIdx}-${qIdx}`);
  const userDiv = document.getElementById(`exq-user-${boostIdx}-${qIdx}`);
  const btn = document.getElementById(`exq-check-${boostIdx}-${qIdx}`);
  if (!reveal.classList.contains('show')) {
    reveal.classList.add('show');
    const userTxt = input.value.trim();
    userDiv.innerHTML = userTxt
      ? `Sua resposta: <b>${userTxt.replace(/</g,'&lt;')}</b>`
      : `<em>(você não digitou nada — tente escrever antes de ver a resposta)</em>`;
    btn.textContent = 'Ocultar resposta';
  } else {
    reveal.classList.remove('show');
    btn.textContent = 'Ver resposta';
  }
}

async function genBoostQuestions(boost) {
  // usa Claude para gerar 3 perguntas naturais em PT
  // com estrutura LEGO + palavras variadas do Boost (agora com complemento)
  const exampleModel = `${boost.lego_stem} ${boost.words[0].en} ${boost.words[0].complement_en}.`;
  const wordsList = boost.words.slice(0, 6).map(w => `${w.en} ${w.complement_en} = ${w.pt_clean} ${w.complement_pt}`).join('; ');
  const system = 'Você é professor de inglês para brasileiros iniciantes. Responda APENAS em JSON válido, sem markdown.';
  const user = `Boost de vocabulário: ${boost.pattern}
Regra: ${boost.rule}
Frase modelo: "${exampleModel}"
Palavras disponíveis (palavra do boost + complemento = tradução): ${wordsList}

Gere EXATAMENTE 3 perguntas de tradução escrita seguindo a estrutura da frase modelo.
Cada pergunta usa uma palavra DIFERENTE do Boost (com seu complemento). As frases em português devem soar naturais para um brasileiro.

Formato JSON:
{"questions":[
  {"id":1,"prompt":"Como dizer \"frase em português natural\" em inglês?","expected":"resposta em inglês","expected_pr":"pronúncia figurada Ovídio","hint_word":{"boost_en":"palavra do boost","boost_pt":"tradução PT da palavra","complement_en":"complemento em inglês","complement_pt":"complemento em português"}},
  {"id":2,...},
  {"id":3,...}
]}

Regras absolutas:
- Usar SOMENTE palavras da lista fornecida no expected.
- expected_pr no sistema de pronúncia figurada brasileira do Protocolo Ovídio (nunca IPA).
- hint_word.boost_en = a palavra do Boost usada nessa pergunta (só a palavra, sem complemento).
- hint_word.boost_pt = tradução em português apenas da palavra do Boost.
- hint_word.complement_en = o complemento em inglês (ex: "this important date").
- hint_word.complement_pt = o complemento em português (ex: "dessa data importante").`;

  const vocab = boost.words.map(w => w.en);
  const json = await fetch('/api/claude', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      system, vocabHint: vocab, max_tokens: 800,
      messages: [{role:'user', content: user}]
    })
  }).then(r => r.json());
  const raw = json.content[0].text.trim().replace(/```json|```/g, '').trim();
  return JSON.parse(raw).questions;
}

function fallbackBoostQuestions(boost) {
  // Gera perguntas deterministicamente a partir dos dados estruturados
  // (LEGO + palavra do Boost + complemento), sem depender de string replace.
  return boost.words.slice(1, 4).map((w, i) => {
    const expected = `${boost.lego_stem} ${w.en} ${w.complement_en}.`;
    const expected_pr = `${boost.lego_pr} ${w.pr} ${w.complement_pr}`;
    return {
      id: i+1,
      prompt: `Como dizer "${boost.lego_pt} ${w.pt_clean} ${w.complement_pt}"?`,
      expected: expected,
      expected_pr: expected_pr,
      hint_word: { boost_en: w.en, boost_pt: w.pt_clean, complement_en: w.complement_en, complement_pt: w.complement_pt }
    };
  });
}

        <p>${ft.objetivo}</p>
      </div>
      <div class="ft-intro-legos">
        <span class="ft-lbl">🧱 5 Estruturas LEGO que você vai dominar</span>
        ${legosHtml}
      </div>
      <div class="ft-intro-vocab">
        <span class="ft-lbl">⚡️ Vocabulário-chave</span>
        ${vocabHtml}
      </div>
      <div class="ft-intro-scenario">
        <span class="ft-lbl">🎭 Cenário</span>
        <p>${ft.cenario}</p>
      </div>
      <div class="ft-intro-actions">
        <button class="btn ft-start-btn" onclick="ftStartQuiz()">Entendi, vamos começar →</button>
      </div>
    </div>`;
}

function ftStartQuiz() {
  ftState.currentQ = 0;
  ftState.attempts = 0;
  ftState.results = [];
  ftState.lastAnswer = '';
  renderFluencyQuestion();
}

// ─────────────────── FASE 2: PERGUNTA ────────────────────
function renderFluencyQuestion() {
  const ft = DAYS[1].fluency;
  const q = ft.perguntas[ftState.currentQ];
  const total = ft.perguntas.length;
  const num = ftState.currentQ + 1;
  const pct = Math.round((ftState.currentQ / total) * 100);

  document.getElementById('fluency-area').innerHTML = `
    <div class="fluency-card ft-question-card">
      <div class="ft-qhead">
        <span class="ft-counter">Pergunta ${num} de ${total}</span>
        <div class="ft-pbar"><div class="ft-pfill" style="width:${pct}%"></div></div>
      </div>

      ${q.contexto ? `<div class="ft-context">${q.contexto}</div>` : ''}

      <div class="ft-ia-bubble" id="ft-ia-bubble">
        <div class="ft-ia-speaker">🤖 Mark</div>
        <div class="ft-ia-text">${q.pergunta_en}</div>
        <div class="ft-ia-actions">
          <button class="ft-icon-btn" data-rowspeak="${q.pergunta_en.replace(/"/g,'&quot;')}"
            aria-label="Ouvir pergunta" title="Ouvir pergunta">🔊</button>
          <button class="ft-icon-btn" onclick="ftToggleTranscription()"
            aria-label="Ver pronúncia" title="Ver pronúncia">📢</button>
          <button class="ft-icon-btn" onclick="ftToggleTranslation()"
            aria-label="Ver tradução" title="Ver tradução">🌐</button>
        </div>
        <div class="ft-ia-transcription" id="ft-transcription">/${q.transcricao}/</div>
        <div class="ft-ia-translation" id="ft-translation">${q.pergunta_pt}</div>
      </div>

      <div class="ft-answer-area" id="ft-answer-area">
        <div class="ft-mode-tabs">
          <button class="ft-mode-btn ${ftState.inputMode === 'text' ? 'active' : ''}"
            onclick="ftSetMode('text')">⌨️ Texto</button>
          <button class="ft-mode-btn ${ftState.inputMode === 'audio' ? 'active' : ''}"
            onclick="ftSetMode('audio')">🎤 Áudio</button>
        </div>
        <div id="ft-input-container"></div>
      </div>

      <div class="ft-actions-row">
        <button class="ft-link-btn" onclick="ftShowSuggestions()">💡 Sugestões</button>
      </div>
      <div id="ft-suggestions-slot"></div>
      <div id="ft-feedback-slot"></div>
    </div>`;

  renderFluencyInput();
}

function ftToggleTranscription() {
  const el = document.getElementById('ft-transcription');
  if (el) el.classList.toggle('show');
}
function ftToggleTranslation() {
  const el = document.getElementById('ft-translation');
  if (el) el.classList.toggle('show');
}

function ftSetMode(mode) {
  ftState.inputMode = mode;
  // reset UI de modo
  const container = document.getElementById('ft-input-container');
  if (!container) return;
  renderFluencyQuestion();
}

function renderFluencyInput() {
  const container = document.getElementById('ft-input-container');
  if (!container) return;
  if (ftState.inputMode === 'text') {
    container.innerHTML = `
      <textarea class="ft-text-input" id="ft-text-input"
        placeholder="Escreva sua resposta em inglês..."
        onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();ftSubmitText()}"></textarea>
      <div class="ft-input-actions">
        <button class="btn ft-send-btn" onclick="ftSubmitText()">Enviar resposta →</button>
      </div>`;
  } else {
    const hasSpeech = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
    if (!hasSpeech) {
      container.innerHTML = `<div class="ap-warn">⚠️ Seu navegador não suporta gravação por voz. Use Chrome ou Edge.</div>`;
      return;
    }
    container.innerHTML = `
      <div class="ft-audio-area">
        <button class="ft-mic-btn" id="ft-mic-btn" onclick="ftToggleMic()">
          <span class="ft-mic-icon">🎤</span>
          <span class="ft-mic-label" id="ft-mic-label">Clique para falar</span>
        </button>
        <div class="ft-mic-status" id="ft-mic-status" style="display:none">
          <span class="ft-mic-wave"></span>
          <span id="ft-mic-timer">60s</span>
        </div>
        <div class="ft-transcript-preview" id="ft-transcript-preview"></div>
      </div>`;
  }
}

// ─────────────────── GRAVAÇÃO ────────────────────
function ftToggleMic() {
  if (ftState.rec) { ftStopMic(); return; }
  ftStartMic();
}

function ftStartMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  const rec = new SR();
  rec.lang = 'en-US';
  rec.continuous = true;
  rec.interimResults = true;
  ftState.rec = rec;

  const btn = document.getElementById('ft-mic-btn');
  const label = document.getElementById('ft-mic-label');
  const status = document.getElementById('ft-mic-status');
  const preview = document.getElementById('ft-transcript-preview');
  const timerEl = document.getElementById('ft-mic-timer');
  btn.classList.add('rec');
  label.textContent = 'Parar gravação';
  status.style.display = 'flex';

  let finalTranscript = '';
  let interimTranscript = '';

  rec.onresult = (e) => {
    interimTranscript = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalTranscript += e.results[i][0].transcript + ' ';
      else interimTranscript += e.results[i][0].transcript;
    }
    if (preview) {
      preview.textContent = (finalTranscript + interimTranscript).trim();
      preview.dataset.final = finalTranscript.trim();
    }
  };
  rec.onerror = () => ftStopMic();

  // timer de 60s
  let secondsLeft = 60;
  ftState.recTimer = setInterval(() => {
    secondsLeft--;
    if (timerEl) timerEl.textContent = `${secondsLeft}s`;
    if (secondsLeft <= 0) ftStopMic();
  }, 1000);

  try { rec.start(); } catch(e) {}
}

function ftStopMic() {
  if (!ftState.rec) return;
  try { ftState.rec.stop(); } catch(e) {}
  ftState.rec = null;
  clearInterval(ftState.recTimer);
  ftState.recTimer = null;
  const btn = document.getElementById('ft-mic-btn');
  const label = document.getElementById('ft-mic-label');
  const status = document.getElementById('ft-mic-status');
  const preview = document.getElementById('ft-transcript-preview');
  if (btn) btn.classList.remove('rec');
  if (label) label.textContent = 'Clique para falar';
  if (status) status.style.display = 'none';
  const text = (preview && preview.dataset.final) ? preview.dataset.final : (preview ? preview.textContent : '');
  if (text && text.trim()) ftSubmitAnswer(text.trim());
}

function ftSubmitText() {
  const input = document.getElementById('ft-text-input');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  ftSubmitAnswer(text);
}

// ─────────────────── FASE 3: AVALIAÇÃO ────────────────────
async function ftSubmitAnswer(answer) {
  ftState.lastAnswer = answer;
  const q = DAYS[1].fluency.perguntas[ftState.currentQ];

  // renderizar bubble do aluno
  const answerHtml = `
    <div class="ft-user-bubble">
      <div class="ft-user-speaker">👤 Você</div>
      <div class="ft-user-text">${escHtml(answer)}</div>
      <div class="ft-user-actions">
        <button class="ft-icon-btn" data-rowspeak="${answer.replace(/"/g,'&quot;')}"
          aria-label="Ouvir sua resposta" title="Ouvir sua resposta">🎵</button>
      </div>
    </div>
    <div class="ft-evaluating" id="ft-evaluating">
      <div class="spinner"></div>
      <p>Avaliando…</p>
    </div>`;
  document.getElementById('ft-feedback-slot').innerHTML = answerHtml;
  // esconder área de input enquanto avalia
  const answerArea = document.getElementById('ft-answer-area');
  if (answerArea) answerArea.style.display = 'none';

  // FAST PATH: comparação textual — economiza tokens
  const norm = normalizeAns(answer);
  const modelNorm = normalizeAns(q.resposta_modelo);
  const isDirectMatch = norm === modelNorm
    || (q.variacoes_aceitas || []).some(v => normalizeAns(v) === norm);

  let evaluation;
  if (isDirectMatch) {
    evaluation = { correct: true, source: 'fast_path' };
  } else {
    // CACHE: já avaliamos esta (pergunta+resposta) antes?
    const cacheKey = `ftEval:day1:q${ftState.currentQ}:${btoa(unescape(encodeURIComponent(norm))).slice(0,40)}`;
    try {
      const cached = localStorage.getItem(cacheKey);
      if (cached) evaluation = JSON.parse(cached);
    } catch(e) {}
    if (!evaluation) {
      try {
        evaluation = await ftEvaluateWithIA(q, answer);
        try { localStorage.setItem(cacheKey, JSON.stringify(evaluation)); } catch(e) {}
      } catch(e) {
        evaluation = { correct: false, error: e.message, feedback: 'Erro na avaliação. Vamos considerar como resposta enviada.' };
      }
    }
  }

  ftState.attempts++;
  renderFluencyEvaluation(evaluation, q);
}

function normalizeAns(s) {
  return String(s || '')
    .toLowerCase()
    .replace(/[.,!?;:"'()]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function escHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function ftEvaluateWithIA(q, answer) {
  const system = 'Você é avaliador de inglês para brasileiros iniciantes. Responda APENAS em JSON válido, sem markdown, sem texto extra.';
  const user = `Pergunta: "${q.pergunta_en}"
Resposta modelo: "${q.resposta_modelo}"
Estrutura LEGO esperada: ${q.estrutura_lego}
Variações aceitas: ${(q.variacoes_aceitas || []).join(' | ')}
Resposta do aluno: "${answer}"

Avalie se a resposta do aluno usa corretamente a estrutura LEGO esperada e responde à pergunta. Aceite variações naturais e pequenas diferenças. Só marque como incorreto se realmente não usou a estrutura ou se a resposta não faz sentido para a pergunta.

JSON:
{
  "correct": true/false,
  "feedback": "1 frase curta em português. Se correto: encorajamento. Se incorreto: explique o que faltou usando a Estrutura LEGO.",
  "usedLegoCorrectly": true/false
}`;

  const res = await fetch('/api/claude', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      system, max_tokens: 300,
      messages: [{role:'user', content: user}]
    })
  }).then(r => r.json());
  const raw = res.content[0].text.trim().replace(/```json|```/g, '').trim();
  return JSON.parse(raw);
}

function renderFluencyEvaluation(ev, q) {
  const slot = document.getElementById('ft-feedback-slot');
  const isLast = ftState.currentQ === DAYS[1].fluency.perguntas.length - 1;
  const canRetry = !ev.correct && ftState.attempts < 2;

  // guardar resultado (só na primeira avaliação da pergunta ou quando avança)
  const alreadyRegistered = ftState.results.length > ftState.currentQ;

  let actionHtml;
  if (ev.correct) {
    if (!alreadyRegistered) ftState.results.push({ correct: true, attempts: ftState.attempts, usedLegos: q.lego_names });
    playSound && playSound('success');
    actionHtml = isLast
      ? `<button class="btn ft-next-btn" onclick="ftFinish()">Ver resultado →</button>`
      : `<button class="btn ft-next-btn" onclick="ftNextQuestion()">Próxima pergunta →</button>`;
  } else if (canRetry) {
    playSound && playSound('error');
    actionHtml = `
      <button class="ap-retry-btn" onclick="ftRetryQuestion()">🔄 Tentar novamente</button>
      <button class="btn-outline ft-skip-btn" onclick="ftSkipQuestion()">➜ Próxima pergunta</button>`;
  } else {
    if (!alreadyRegistered) ftState.results.push({ correct: false, attempts: ftState.attempts, usedLegos: [] });
    playSound && playSound('error');
    actionHtml = isLast
      ? `<button class="btn ft-next-btn" onclick="ftFinish()">Ver resultado →</button>`
      : `<button class="btn ft-next-btn" onclick="ftNextQuestion()">Próxima pergunta →</button>`;
  }

  const verdictHtml = ev.correct
    ? `<div class="ft-verdict ok">✅ That's correct!</div>`
    : `<div class="ft-verdict err">✗ That's not quite right</div>`;

  const explainHtml = ev.correct ? '' : `
    <div class="ft-feedback-explain">
      <div class="ft-fb-lbl">💡 Resposta modelo:</div>
      <div class="ft-fb-model">
        <span>${escHtml(q.resposta_modelo)}</span>
        <button class="ft-icon-btn" data-rowspeak="${q.resposta_modelo.replace(/"/g,'&quot;')}"
          aria-label="Ouvir resposta modelo" title="Ouvir">🔊</button>
      </div>
      <div class="ft-fb-lego">Estrutura LEGO: <strong>${q.estrutura_lego}</strong></div>
      ${ev.feedback ? `<div class="ft-fb-tip">${escHtml(ev.feedback)}</div>` : ''}
    </div>`;

  // atualizar slot: manter user-bubble, trocar spinner por verdict + feedback
  const answerText = escHtml(ftState.lastAnswer);
  slot.innerHTML = `
    <div class="ft-user-bubble">
      <div class="ft-user-speaker">👤 Você</div>
      <div class="ft-user-text">${answerText}</div>
      <div class="ft-user-actions">
        <button class="ft-icon-btn" data-rowspeak="${ftState.lastAnswer.replace(/"/g,'&quot;')}"
          aria-label="Ouvir sua resposta" title="Ouvir sua resposta">🎵</button>
      </div>
    </div>
    <div class="ft-feedback ${ev.correct ? 'ok' : 'err'}">
      ${verdictHtml}
      ${explainHtml}
      <div class="ft-fb-actions">${actionHtml}</div>
    </div>`;
}

function ftRetryQuestion() {
  renderFluencyQuestion();
}
function ftSkipQuestion() {
  // registrar como não-acerto e avançar
  if (ftState.results.length <= ftState.currentQ) {
    ftState.results.push({ correct: false, attempts: ftState.attempts, usedLegos: [] });
  }
  ftNextQuestion();
}
function ftNextQuestion() {
  ftState.currentQ++;
  ftState.attempts = 0;
  ftState.lastAnswer = '';
  renderFluencyQuestion();
}

// ─────────────────── SUGESTÕES ────────────────────
async function ftShowSuggestions() {
  const qIdx = ftState.currentQ;
  const slot = document.getElementById('ft-suggestions-slot');
  if (!slot) return;
  if (slot.dataset.shownFor === String(qIdx) && slot.innerHTML) {
    slot.style.display = slot.style.display === 'none' ? 'block' : 'none';
    return;
  }
  slot.dataset.shownFor = String(qIdx);
  slot.style.display = 'block';

  // usar cache se já existir
  let suggestions = ftState.suggestionsShown[qIdx];
  if (!suggestions) {
    const q = DAYS[1].fluency.perguntas[qIdx];
    // usar diretamente as variações aceitas + resposta modelo — sem chamar IA!
    suggestions = [q.resposta_modelo, ...(q.variacoes_aceitas || [])].slice(0, 3);
    ftState.suggestionsShown[qIdx] = suggestions;
  }

  slot.innerHTML = `
    <div class="ft-suggestions-box">
      <div class="ft-fb-lbl">💡 Respostas possíveis (todas usam a Estrutura LEGO do dia)</div>
      ${suggestions.map(s => `
        <div class="ft-sugg-line">
          <span>${escHtml(s)}</span>
          <button class="ft-icon-btn" data-rowspeak="${s.replace(/"/g,'&quot;')}" aria-label="Ouvir" title="Ouvir">🔊</button>
        </div>`).join('')}
    </div>`;
}

// ─────────────────── FASE FINAL: RESULTADO ────────────────────
function ftFinish() {
  const ft = DAYS[1].fluency;
  const total = ft.perguntas.length;
  const correct = ftState.results.filter(r => r.correct).length;
  const firstTry = ftState.results.filter(r => r.correct && r.attempts === 1).length;

  // estruturas LEGO dominadas: usadas em respostas corretas
  const dominatedSet = new Set();
  ftState.results.forEach(r => { if (r.correct) r.usedLegos.forEach(l => dominatedSet.add(l)); });
  const dominated = [...dominatedSet];

  const missing = DAYS[1].legos
    .map(l => l.stem)
    .filter(name => !dominatedSet.has(name));

  const vocabList = ft.vocabulario_chave.map(v => v.en).join(', ');

  let msg;
  if (correct === total && firstTry === total) msg = 'Perfeito de primeira em todas! 🎯';
  else if (correct === total) msg = 'Todas corretas — bom trabalho!';
  else if (correct >= Math.ceil(total * 0.6)) msg = 'Bom progresso — continue praticando!';
  else msg = 'Vale revisar as estruturas LEGO e tentar de novo.';

  document.getElementById('fluency-area').innerHTML = `
    <div class="fluency-card ft-finish-card">
      <div class="ft-finish-title">🎉 ${DAYS[1].title} completo!</div>
      <div class="ft-finish-score">${correct}<span class="ft-finish-total">/${total}</span></div>
      <div class="ft-finish-msg">${msg}</div>

      <div class="ft-finish-section">
        <div class="ft-fb-lbl">🧱 Estruturas LEGO dominadas</div>
        ${dominated.length
          ? `<div class="ft-finish-chips">${dominated.map(n => `<span class="ft-chip ok">${n}</span>`).join('')}</div>`
          : `<div class="ft-finish-empty">Nenhuma ainda — vale revisar.</div>`}
      </div>

      ${missing.length ? `
        <div class="ft-finish-section">
          <div class="ft-fb-lbl">🔄 Ainda pode praticar</div>
          <div class="ft-finish-chips">${missing.map(n => `<span class="ft-chip miss">${n}</span>`).join('')}</div>
        </div>` : ''}

      <div class="ft-finish-section">
        <div class="ft-fb-lbl">⚡️ Vocabulário-chave desta sessão</div>
        <div class="ft-finish-vocab">${vocabList}</div>
      </div>

      <div class="ft-finish-actions">
        <button class="btn" onclick="renderFluencyIntro()">🔄 Praticar novamente</button>
      </div>
    </div>`;
}



// ── init ───────────────────────────────────────────────
buildSelector();
updatePageTitle();
// conectar cliques das tabs de seção
document.querySelectorAll('.section-tab').forEach(t => {
  t.addEventListener('click', () => switchSection(t.dataset.section));
});
const firstBtn = document.querySelector('.sel-btn');
if (firstBtn) firstBtn.click();
</script>
